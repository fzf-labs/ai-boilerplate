syntax = "proto3";

package admin.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

//import "google/protobuf/timestamp.proto";
//import "validate/validate.proto"; use buf first
option go_package = "github.com/fzf-labs/ai-boilerplate-backend/api/admin/v1;v1";

//通用-轮播图
service Banner {
  //通用-轮播图-创建一条数据
  rpc CreateBanner(CreateBannerReq) returns (CreateBannerReply) {
    option (google.api.http) = {
      post: "/admin/v1/banner/create"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
  //通用-轮播图-更新一条数据
  rpc UpdateBanner(UpdateBannerReq) returns (UpdateBannerReply) {
    option (google.api.http) = {
      post: "/admin/v1/banner/update"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
  //通用-轮播图-更新状态
  rpc UpdateBannerStatus(UpdateBannerStatusReq) returns (UpdateBannerStatusReply) {
    option (google.api.http) = {
      post: "/admin/v1/banner/update/status"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
  //通用-轮播图-删除一条数据
  rpc DeleteBanner(DeleteBannerReq) returns (DeleteBannerReply) {
    option (google.api.http) = {
      post: "/admin/v1/banner/delete"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
  //通用-轮播图-单条数据查询
  rpc GetBannerInfo(GetBannerInfoReq) returns (GetBannerInfoReply) {
    option (google.api.http) = {get: "/admin/v1/banner/info"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
  //通用-轮播图-列表数据查询
  rpc GetBannerList(GetBannerListReq) returns (GetBannerListReply) {
    option (google.api.http) = {get: "/admin/v1/banner/list"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
}

//通用-轮播图信息
message BannerInfo {
  string id = 1; // id
  string tenantId = 2; // 租户id
  string title = 3; // 标题
  string imageURL = 4; // 图片URL
  string linkURL = 5; // 跳转链接
  string linkType = 6; // 跳转类型
  string position = 7; // 展示位置
  string platform = 8; // 平台
  int32 sort = 9; // 排序
  int32 status = 10; // 状态(-1禁用,1开启)
  string startTime = 11; // 开始时间
  string endTime = 12; // 结束时间
  string createdAt = 13; // 创建时间
  string updatedAt = 14; // 更新时间
}

//请求-通用-轮播图-创建一条数据
message CreateBannerReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "title",
        "imageURL",
        "linkURL",
        "linkType",
        "position",
        "platform",
        "sort",
        "status"
      ]
    }
  };
  string tenantId = 1 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ]; // 租户id
  string title = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }]; // 标题
  string imageURL = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }]; // 图片URL
  string linkURL = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }]; // 跳转链接
  string linkType = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }]; // 跳转类型
  string position = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }]; // 展示位置
  string platform = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }]; // 平台
  int32 sort = 8; // 排序
  int32 status = 9; // 状态(-1禁用,1开启)
  string startTime = 10 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ]; // 开始时间
  string endTime = 11 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ]; // 结束时间
}

//响应-通用-轮播图-创建一条数据
message CreateBannerReply {
  string id = 1; // id
}

//请求-通用-轮播图-更新一条数据
message UpdateBannerReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "id",
        "title",
        "imageURL",
        "linkURL",
        "linkType",
        "position",
        "platform",
        "sort",
        "status"
      ]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
  string tenantId = 2 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ]; // 租户id
  string title = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }]; // 标题
  string imageURL = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }]; // 图片URL
  string linkURL = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }]; // 跳转链接
  string linkType = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }]; // 跳转类型
  string position = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }]; // 展示位置
  string platform = 8 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }]; // 平台
  int32 sort = 9; // 排序
  int32 status = 10; // 状态(-1禁用,1开启)
  string startTime = 11 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ]; // 开始时间
  string endTime = 12 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ]; // 结束时间
}

//响应-通用-轮播图-更新一条数据
message UpdateBannerReply {}

//请求-通用-轮播图-更新状态
message UpdateBannerStatusReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "id",
        "status"
      ]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
  int32 status = 2; // 状态(-1禁用,1开启)
}

//响应-通用-轮播图-更新状态
message UpdateBannerStatusReply {}

//请求-通用-轮播图-删除一条数据
message DeleteBannerReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["id"]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
}

//响应-通用-轮播图-删除一条数据
message DeleteBannerReply {}

//请求-通用-轮播图-单条数据查询
message GetBannerInfoReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["id"]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
}

//响应-通用-轮播图-单条数据查询
message GetBannerInfoReply {
  BannerInfo info = 1;
}

//请求-通用-轮播图-列表数据查询
message GetBannerListReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "page",
        "pageSize"
      ]
    }
  };
  int32 page = 1 [(buf.validate.field).int32 = {gte: 1}]; //页码
  int32 pageSize = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1000
  }]; //页数
  string title = 3 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 200
    }
  ]; // 标题
  string position = 4 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ]; // 展示位置
  string platform = 5 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 32
    }
  ]; // 平台
  string linkType = 6 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 32
    }
  ]; // 跳转类型
  int32 status = 7 [(buf.validate.field).ignore = IGNORE_IF_UNPOPULATED]; // 状态(-1禁用,1开启)
}

//响应-通用-轮播图-列表数据查询
message GetBannerListReply {
  int32 total = 1; //总数
  repeated BannerInfo list = 2; // 列表数据
}
