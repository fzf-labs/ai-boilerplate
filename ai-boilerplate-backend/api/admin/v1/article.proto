syntax = "proto3";

package admin.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/fzf-labs/ai-boilerplate-backend/api/admin/v1;v1";

//内容-文章
service Article {
  //内容-文章-创建一条数据
  rpc CreateArticle(CreateArticleReq) returns (CreateArticleReply) {
    option (google.api.http) = {
      post: "/admin/v1/article/create"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
  //内容-文章-更新一条数据
  rpc UpdateArticle(UpdateArticleReq) returns (UpdateArticleReply) {
    option (google.api.http) = {
      post: "/admin/v1/article/update"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
  //内容-文章-更新状态(发布/下线/草稿)
  rpc UpdateArticleStatus(UpdateArticleStatusReq) returns (UpdateArticleStatusReply) {
    option (google.api.http) = {
      post: "/admin/v1/article/update/status"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
  //内容-文章-删除一条数据
  rpc DeleteArticle(DeleteArticleReq) returns (DeleteArticleReply) {
    option (google.api.http) = {
      post: "/admin/v1/article/delete"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
  //内容-文章-单条数据查询
  rpc GetArticleInfo(GetArticleInfoReq) returns (GetArticleInfoReply) {
    option (google.api.http) = {get: "/admin/v1/article/info"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
  //内容-文章-列表数据查询
  rpc GetArticleList(GetArticleListReq) returns (GetArticleListReply) {
    option (google.api.http) = {get: "/admin/v1/article/list"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
}

//内容-文章信息
message ArticleInfo {
  string id = 1; // id
  string title = 2; // 标题
  string summary = 3; // 摘要
  string coverImage = 4; // 封面图
  string contentMarkdown = 5; // Markdown内容
  int32 status = 6; // 状态(-1下线,0草稿,1已发布)
  string publishTime = 7; // 发布时间
  repeated string tags = 8; // 标签
  bool isRecommend = 9; // 是否推荐
  bool isHot = 10; // 是否热门
  int64 viewCount = 11; // 浏览量
  int64 likeCount = 12; // 点赞数
  string createdAt = 13; // 创建时间
  string updatedAt = 14; // 更新时间
}

//请求-内容-文章-创建一条数据
message CreateArticleReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "title",
        "contentMarkdown"
      ]
    }
  };
  string title = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }]; // 标题
  string summary = 2 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 500
    }
  ]; // 摘要
  string coverImage = 3 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 500
    }
  ]; // 封面图
  string contentMarkdown = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200000
  }]; // Markdown内容
  int32 status = 5 [(buf.validate.field).ignore = IGNORE_IF_UNPOPULATED]; // 状态(-1下线,0草稿,1已发布)
  string publishTime = 6 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ]; // 发布时间(RFC3339)
  repeated string tags = 7 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).repeated = {max_items: 20}
  ]; // 标签
  bool isRecommend = 8; // 是否推荐
  bool isHot = 9; // 是否热门
}

//响应-内容-文章-创建一条数据
message CreateArticleReply {
  string id = 1; // id
}

//请求-内容-文章-更新一条数据
message UpdateArticleReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "id",
        "title",
        "contentMarkdown"
      ]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
  string title = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }]; // 标题
  string summary = 3 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 500
    }
  ]; // 摘要
  string coverImage = 4 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 500
    }
  ]; // 封面图
  string contentMarkdown = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200000
  }]; // Markdown内容
  repeated string tags = 6 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).repeated = {max_items: 20}
  ]; // 标签
  bool isRecommend = 7; // 是否推荐
  bool isHot = 8; // 是否热门
}

//响应-内容-文章-更新一条数据
message UpdateArticleReply {}

//请求-内容-文章-更新状态
message UpdateArticleStatusReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "id",
        "status"
      ]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
  int32 status = 2 [(buf.validate.field).int32 = {
    gte: -1
    lte: 1
  }]; // 状态(-1下线,0草稿,1已发布)
  string publishTime = 3 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ]; // 发布时间(RFC3339)
}

//响应-内容-文章-更新状态
message UpdateArticleStatusReply {}

//请求-内容-文章-删除一条数据
message DeleteArticleReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["id"]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
}

//响应-内容-文章-删除一条数据
message DeleteArticleReply {}

//请求-内容-文章-单条数据查询
message GetArticleInfoReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["id"]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
}

//响应-内容-文章-单条数据查询
message GetArticleInfoReply {
  ArticleInfo info = 1;
}

//请求-内容-文章-列表数据查询
message GetArticleListReq {
  int32 page = 1 [(buf.validate.field).int32 = {gte: 1}]; // 页码
  int32 pageSize = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1000
  }]; // 页数
  optional int32 status = 3 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).int32 = {
      gte: -1
      lte: 1
    }
  ]; // 状态(-1下线,0草稿,1已发布)
  string keyword = 4 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 100
    }
  ]; // 关键词(标题)
}

//响应-内容-文章-列表数据查询
message GetArticleListReply {
  int32 total = 1; // 总数
  repeated ArticleInfo list = 2; // 列表
}
