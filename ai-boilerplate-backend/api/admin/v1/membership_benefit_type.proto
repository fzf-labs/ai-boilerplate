syntax = "proto3";

package admin.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

//import "google/protobuf/timestamp.proto";
//import "validate/validate.proto"; use buf first
option go_package = "github.com/fzf-labs/ai-boilerplate-backend/api/admin/v1;v1";

//会员权益类型表
service MembershipBenefitType {
  //会员权益类型表-创建一条数据
  rpc CreateMembershipBenefitType(CreateMembershipBenefitTypeReq) returns (CreateMembershipBenefitTypeReply) {
    option (google.api.http) = {
      post: "/admin/v1/membership_benefit_type/create"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
  //会员权益类型表-更新一条数据
  rpc UpdateMembershipBenefitType(UpdateMembershipBenefitTypeReq) returns (UpdateMembershipBenefitTypeReply) {
    option (google.api.http) = {
      post: "/admin/v1/membership_benefit_type/update"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
  //会员权益类型表-更新状态
  rpc UpdateMembershipBenefitTypeStatus(UpdateMembershipBenefitTypeStatusReq) returns (UpdateMembershipBenefitTypeStatusReply) {
    option (google.api.http) = {
      post: "/admin/v1/membership_benefit_type/update/status"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
  //会员权益类型表-删除一条数据
  rpc DeleteMembershipBenefitType(DeleteMembershipBenefitTypeReq) returns (DeleteMembershipBenefitTypeReply) {
    option (google.api.http) = {
      post: "/admin/v1/membership_benefit_type/delete"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
  //会员权益类型表-单条数据查询
  rpc GetMembershipBenefitTypeInfo(GetMembershipBenefitTypeInfoReq) returns (GetMembershipBenefitTypeInfoReply) {
    option (google.api.http) = {get: "/admin/v1/membership_benefit_type/info"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
  //会员权益类型表-列表数据查询
  rpc GetMembershipBenefitTypeList(GetMembershipBenefitTypeListReq) returns (GetMembershipBenefitTypeListReply) {
    option (google.api.http) = {get: "/admin/v1/membership_benefit_type/list"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
}

//会员权益类型表信息
message MembershipBenefitTypeInfo {
  string id = 1; // id
  string benefitKey = 2; // 权益标识
  string benefitName = 3; // 权益名称
  string benefitIcon = 4; // 权益图标
  string benefitDesc = 5; // 权益描述
  int32 sort = 6; // 排序
  int32 status = 7; // 状态(-1禁用,1启用)
  string createdAt = 8; // 创建时间
  string updatedAt = 9; // 更新时间
}

//请求-会员权益类型表-创建一条数据
message CreateMembershipBenefitTypeReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "benefitKey",
        "benefitName",
        "status"
      ]
    }
  };
  string benefitKey = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }]; // 权益标识
  string benefitName = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }]; // 权益名称
  string benefitIcon = 3 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 500
    }
  ]; // 权益图标
  string benefitDesc = 4 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 500
    }
  ]; // 权益描述
  int32 sort = 5 [(buf.validate.field).ignore = IGNORE_IF_UNPOPULATED]; // 排序
  int32 status = 6; // 状态(-1禁用,1启用)
}

//响应-会员权益类型表-创建一条数据
message CreateMembershipBenefitTypeReply {
  string id = 1; // id
}

//请求-会员权益类型表-更新一条数据
message UpdateMembershipBenefitTypeReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "id",
        "benefitKey",
        "benefitName",
        "status"
      ]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
  string benefitKey = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }]; // 权益标识
  string benefitName = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }]; // 权益名称
  string benefitIcon = 4 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 500
    }
  ]; // 权益图标
  string benefitDesc = 5 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 500
    }
  ]; // 权益描述
  int32 sort = 6 [(buf.validate.field).ignore = IGNORE_IF_UNPOPULATED]; // 排序
  int32 status = 7; // 状态(-1禁用,1启用)
}

//响应-会员权益类型表-更新一条数据
message UpdateMembershipBenefitTypeReply {}

//请求-会员权益类型表-更新状态
message UpdateMembershipBenefitTypeStatusReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "id",
        "status"
      ]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
  int32 status = 2; // 状态(-1禁用,1启用)
}

//响应-会员权益类型表-更新状态
message UpdateMembershipBenefitTypeStatusReply {}

//请求-会员权益类型表-删除一条数据
message DeleteMembershipBenefitTypeReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["id"]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
}

//响应-会员权益类型表-删除一条数据
message DeleteMembershipBenefitTypeReply {}

//请求-会员权益类型表-单条数据查询
message GetMembershipBenefitTypeInfoReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["id"]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
}

//响应-会员权益类型表-单条数据查询
message GetMembershipBenefitTypeInfoReply {
  MembershipBenefitTypeInfo info = 1;
}

//请求-会员权益类型表-列表数据查询
message GetMembershipBenefitTypeListReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "page",
        "pageSize"
      ]
    }
  };
  int32 page = 1 [(buf.validate.field).int32 = {gte: 1}]; //页码
  int32 pageSize = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1000
  }]; //页数
  string benefitKey = 3; // 权益标识
  string benefitName = 4; // 权益名称
}

//响应-会员权益类型表-列表数据查询
message GetMembershipBenefitTypeListReply {
  int32 total = 1; //总数
  repeated MembershipBenefitTypeInfo list = 2; // 列表数据
}
