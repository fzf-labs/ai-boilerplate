syntax = "proto3";

package admin.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

//import "google/protobuf/timestamp.proto";
//import "validate/validate.proto"; use buf first
option go_package = "github.com/fzf-labs/ai-boilerplate-backend/api/admin/v1;v1";

//用户会员变更记录表
service UserMembershipChangeRecord {
  //用户会员变更记录表-列表数据查询
  rpc GetUserMembershipChangeList(GetUserMembershipChangeListReq) returns (GetUserMembershipChangeListReply) {
    option (google.api.http) = {get: "/admin/v1/user_membership_change/list"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
}

//用户会员关系表信息
message UserMembershipChangeItem {
  string userId = 1; // 用户ID
  string membershipType = 2; // 会员类型编码(normal,vip,svip)
  string expiredAt = 3; // 到期时间(普通会员为NULL,表示永不过期)
  int32 autoRenew = 4; // 是否自动续费(0否,1是)
  int32 autoRenewDays = 5; // 自动续费天数
  int32 status = 6; // 状态(-1禁用,1正常)
  string createdAt = 7; // 创建时间
  string updatedAt = 8; // 更新时间
}

//用户会员变更记录表信息
message UserMembershipChangeInfo {
  string id = 1; // id
  string userId = 2; // 用户ID
  string sourceType = 3; // 来源类型(order,activation_code,admin)
  string sourceId = 4; // 来源ID(订单ID/激活码)
  UserMembershipChangeItem before = 5; // 变更前会员类型
  UserMembershipChangeItem after = 6; // 变更后会员类型
  string remark = 7; // 备注
  string createdAt = 8; // 创建时间
  string updatedAt = 9; // 更新时间
}

//请求-用户会员变更记录表-列表数据查询
message GetUserMembershipChangeListReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "page",
        "pageSize",
        "userId",
        "sourceType",
        "sourceId"
      ]
    }
  };
  int32 page = 1 [(buf.validate.field).int32 = {gte: 1}]; //页码
  int32 pageSize = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1000
  }]; //页数
  string userId = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // 用户ID
  string sourceType = 4; // 来源类型(order,activation_code,admin)
  string sourceId = 5; // 来源ID(订单ID/激活码)
}

//响应-用户会员变更记录表-列表数据查询
message GetUserMembershipChangeListReply {
  int32 total = 1; //总数
  repeated UserMembershipChangeInfo list = 2; // 列表数据
}
