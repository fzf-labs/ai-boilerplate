syntax = "proto3";

package admin.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

//import "google/protobuf/timestamp.proto";
//import "validate/validate.proto"; use buf first
option go_package = "github.com/fzf-labs/ai-boilerplate-backend/api/admin/v1;v1";

//内容-活动
service Activity {
  //内容-活动-创建一条数据
  rpc CreateActivity(CreateActivityReq) returns (CreateActivityReply) {
    option (google.api.http) = {
      post: "/admin/v1/activity/create"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }

  //内容-活动-更新一条数据
  rpc UpdateActivity(UpdateActivityReq) returns (UpdateActivityReply) {
    option (google.api.http) = {
      post: "/admin/v1/activity/update"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }

  //内容-活动-更新状态
  rpc UpdateActivityStatus(UpdateActivityStatusReq) returns (UpdateActivityStatusReply) {
    option (google.api.http) = {
      post: "/admin/v1/activity/update/status"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }

  //内容-活动-删除一条数据
  rpc DeleteActivity(DeleteActivityReq) returns (DeleteActivityReply) {
    option (google.api.http) = {
      post: "/admin/v1/activity/delete"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }

  //内容-活动-单条数据查询
  rpc GetActivityInfo(GetActivityInfoReq) returns (GetActivityInfoReply) {
    option (google.api.http) = {get: "/admin/v1/activity/info"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }

  //内容-活动-列表数据查询
  rpc GetActivityList(GetActivityListReq) returns (GetActivityListReply) {
    option (google.api.http) = {get: "/admin/v1/activity/list"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
}

//内容-活动信息
message ActivityInfo {
  string id = 1; // id
  string tenantId = 2; // 租户id
  string title = 3; // 标题
  string imageURL = 4; // 图片URL
  string linkURL = 5; // 跳转链接
  string linkType = 6; // 跳转类型
  int32 sort = 7; // 排序
  int32 status = 8; // 状态(-1禁用,1开启)
  string startTime = 9; // 开始时间
  string endTime = 10; // 结束时间
  string createdAt = 11; // 创建时间
  string updatedAt = 12; // 更新时间
}

//请求-内容-活动-创建一条数据
message CreateActivityReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "title",
        "imageURL",
        "linkURL",
        "linkType",
        "sort",
        "status"
      ]
    }
  };
  string tenantId = 1 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ]; // 租户id
  string title = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }]; // 标题
  string imageURL = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }]; // 图片URL
  string linkURL = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }]; // 跳转链接
  string linkType = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }]; // 跳转类型
  int32 sort = 6; // 排序
  int32 status = 7; // 状态(-1禁用,1开启)
  string startTime = 8 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ]; // 开始时间
  string endTime = 9 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ]; // 结束时间
}

//响应-内容-活动-创建一条数据
message CreateActivityReply {
  string id = 1; // id
}

//请求-内容-活动-更新一条数据
message UpdateActivityReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "id",
        "title",
        "imageURL",
        "linkURL",
        "linkType",
        "sort",
        "status"
      ]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
  string title = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }]; // 标题
  string imageURL = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }]; // 图片URL
  string linkURL = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }]; // 跳转链接
  string linkType = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
  }]; // 跳转类型
  int32 sort = 6; // 排序
  int32 status = 7; // 状态(-1禁用,1开启)
  string startTime = 8 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ]; // 开始时间
  string endTime = 9 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
    }
  ]; // 结束时间
}

//响应-内容-活动-更新一条数据
message UpdateActivityReply {}

//请求-内容-活动-更新状态
message UpdateActivityStatusReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: [
        "id",
        "status"
      ]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
  int32 status = 2; // 状态(-1禁用,1开启)
}

//响应-内容-活动-更新状态
message UpdateActivityStatusReply {}

//请求-内容-活动-删除一条数据
message DeleteActivityReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["id"]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
}

//响应-内容-活动-删除一条数据
message DeleteActivityReply {}

//请求-内容-活动-单条数据查询
message GetActivityInfoReq {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      required: ["id"]
    }
  };
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }]; // id
}

//响应-内容-活动-单条数据查询
message GetActivityInfoReply {
  ActivityInfo info = 1; // 详情
}

//请求-内容-活动-列表数据查询
message GetActivityListReq {
  string keyword = 1 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 100
    }
  ]; // 关键词(标题)
  int32 status = 2 [
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED,
    (buf.validate.field).int32 = {
      gte: -1
      lte: 1
    }
  ]; // 状态(-1禁用,1开启)
  int32 page = 3 [(buf.validate.field).int32 = {gte: 1}]; //页码
  int32 pageSize = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 1000
  }]; //页数
}

//响应-内容-活动-列表数据查询
message GetActivityListReply {
  int32 total = 1; //总数
  repeated ActivityInfo list = 2; // 列表数据
}
