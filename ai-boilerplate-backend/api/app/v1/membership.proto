syntax = "proto3";

package app.v1;

//import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/fzf-labs/ai-boilerplate-backend/api/app/v1;v1";

// 会员服务
service Membership {
  // 获取用户会员基础信息
  rpc GetUserMembershipInfo(GetUserMembershipInfoReq) returns (GetUserMembershipInfoReply) {
    option (google.api.http) = {get: "/app/v1/membership/info"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }

  // 获取会员权益列表
  rpc GetMembershipBenefits(GetMembershipBenefitsReq) returns (GetMembershipBenefitsReply) {
    option (google.api.http) = {get: "/app/v1/membership/benefits"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      parameters: {
        headers: {
          name: "Authorization"
          description: "Bearer Token"
          type: STRING
          required: true
        }
      }
    };
  }
}

// 请求-获取用户会员基础信息
message GetUserMembershipInfoReq {}

// 响应-获取用户会员基础信息
message GetUserMembershipInfoReply {
  string membershipType = 1; // 会员类型编码(normal,vip,svip)
  string membershipName = 2; // 会员类型名称
  string membershipDescription = 3; // 会员类型描述
  int32 status = 4; // 会员状态(-1禁用,1正常)
  string expiredAt = 5; // 到期时间(普通会员为空,表示永不过期)
  bool isExpired = 6; // 是否已过期
  int32 autoRenew = 7; // 是否自动续费(0否,1是)
  int32 autoRenewDays = 8; // 自动续费天数
  string createdAt = 9; // 开通时间
}

// 请求-获取会员权益列表
message GetMembershipBenefitsReq {
  string membershipType = 1; // 会员类型编码(可选,不传则返回当前用户会员等级的权益)
}

// 响应-获取会员权益列表
message GetMembershipBenefitsReply {
  repeated MembershipBenefit benefits = 1; // 权益列表
}

// 会员权益信息
message MembershipBenefit {
  string benefitKey = 1; // 权益标识
  string benefitName = 2; // 权益名称
  string benefitDesc = 3; // 权益描述
  string benefitValue = 4; // 权益值
  string benefitNum = 5; // 权益次数
  int32 sort = 6; // 排序
}
