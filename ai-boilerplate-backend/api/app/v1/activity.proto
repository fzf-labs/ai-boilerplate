syntax = "proto3";

package app.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";

option go_package = "github.com/fzf-labs/ai-boilerplate-backend/api/app/v1;v1";

//内容-活动
service Activity {
  //内容-活动-列表数据查询
  rpc ListActivities(ListActivitiesReq) returns (ListActivitiesReply) {
    option (google.api.http) = {get: "/app/v1/activity/list"};
  }
}

//内容-活动信息
message ActivityItem {
  string id = 1; // id
  string title = 2; // 标题
  string imageURL = 3; // 图片URL
  string linkURL = 4; // 跳转链接
  string linkType = 5; // 跳转类型
  int32 sort = 6; // 排序
}

//请求-内容-活动-列表数据查询
message ListActivitiesReq {
  int32 page = 1 [(buf.validate.field).int32 = {gte: 1}]; // 页码
  int32 pageSize = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }]; // 每页数量
}

//响应-内容-活动-列表数据查询
message ListActivitiesReply {
  int64 total = 1; // 总数
  repeated ActivityItem list = 2; // 列表数据
  int32 page = 3; // 当前页
  int32 pageSize = 4; // 每页数量
}
