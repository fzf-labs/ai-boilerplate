name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20.19.0"
  JAVA_VERSION: "21"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai-boilerplate-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ai-boilerplate-backend/go.mod
          cache: true
          cache-dependency-path: ai-boilerplate-backend/go.sum
      - name: Test
        run: go test ./...

  admin:
    name: Admin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ai-boilerplate-admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ai-boilerplate-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:type --filter=@vben/web-antd

  uniapp:
    name: UniApp
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ai-boilerplate-uniapp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ai-boilerplate-uniapp/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:type

  pc:
    name: PC
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ai-boilerplate-pc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ai-boilerplate-pc/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  chrome-extension:
    name: Chrome Extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ai-boilerplate-chrome-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ai-boilerplate-chrome-extension/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test

  electron:
    name: Electron
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ai-boilerplate-electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck

  tauri:
    name: Tauri
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ai-boilerplate-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --no-audit --no-fund
      - run: npm run build

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: ai-boilerplate-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Create debug keystore
        run: |
          for keystore_dir in "$HOME/.android" "$HOME/.config/.android"; do
            mkdir -p "$keystore_dir"
            if [ ! -f "$keystore_dir/debug.keystore" ]; then
              keytool -genkeypair \
                -keystore "$keystore_dir/debug.keystore" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          done
      - run: ./gradlew --no-daemon detekt test assembleDebug -x validateSigningDebug

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ai-boilerplate-ios
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Caches/tuist
          key: ios-swiftpm-${{ runner.os }}-${{ hashFiles('ai-boilerplate-ios/Package.resolved', 'ai-boilerplate-ios/Package.swift', 'ai-boilerplate-ios/Project.swift', 'ai-boilerplate-ios/.mise.toml') }}
          restore-keys: |
            ios-swiftpm-${{ runner.os }}-
      - run: swift build
